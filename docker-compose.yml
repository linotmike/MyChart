services:
  mysql:
    image: mysql:8.4
    container_name: mychart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mychart
      MYSQL_USER: mychart_user
      MYSQL_PASSWORD: mychart_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mychart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mychart_mysql_data:
