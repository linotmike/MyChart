spring:
  datasource:
    url: jdbc:h2:mem:mychart_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  liquibase:
    enabled: false

logging:
  level:
    root: WARN
